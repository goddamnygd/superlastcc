<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Log in - Dead bai Daylight THE WIKI</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <video id="bgVideo" class="bg-video" autoplay muted loop playsinline aria-hidden="true"></video>
    <header class="topbar">
        <div class="brand">
            <span class="dbd-logo">DEAD BAI<br>DAYLIGHT <span class="scratch">|||||</span></span>
            <span class="brand-divider"></span>
            <span class="brand-title">THE WIKI</span>
        </div>
    </header>

    <main>
        <section class="card" aria-labelledby="title">
            <div class="card-head">
                <p class="kicker">MEMBERS ONLY</p>
                <h1 id="title">Enter the fog</h1>
                <p class="lead">Log in or create a free account to browse the full Survivor and Killer roster.</p>
            </div>

            <p id="notice" class="notice" role="status" hidden></p>

            <div class="tabs" role="tablist" aria-label="Log in or create an account">
                <button id="tabLogin" class="tab" role="tab" aria-controls="panelLogin" aria-selected="true" type="button">LOG IN</button>
                <button id="tabRegister" class="tab" role="tab" aria-controls="panelRegister" aria-selected="false" type="button">CREATE ACCOUNT</button>
            </div>

            <!-- LOG IN -->
            <div id="panelLogin" class="panel" role="tabpanel" aria-labelledby="tabLogin">
                <form id="loginForm" novalidate>
                    <label for="loginId">USERNAME OR EMAIL</label>
                    <input id="loginId" name="identifier" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required>

                    <label for="loginPw">PASSWORD</label>
                    <div class="field">
                        <input id="loginPw" name="password" type="password" autocomplete="current-password" required>
                        <button class="toggle-pw" type="button" data-for="loginPw" aria-pressed="false" aria-label="Show or hide password">SHOW</button>
                    </div>

                    <p id="loginError" class="error" role="alert" aria-live="polite"></p>
                    <button id="loginBtn" class="submit" type="submit">LOG IN</button>
                </form>
                <p class="switch">New here? <button class="link" type="button" data-switch="register">Create an account</button></p>
            </div>

            <!-- CREATE ACCOUNT -->
            <div id="panelRegister" class="panel" role="tabpanel" aria-labelledby="tabRegister" hidden>
                <form id="registerForm" novalidate>
                    <label for="regUser">USERNAME</label>
                    <input id="regUser" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="30" required>
                    <p class="hint">3 to 30 characters: letters, numbers and underscore.</p>

                    <label for="regEmail">EMAIL</label>
                    <input id="regEmail" name="email" type="email" autocomplete="email" required>

                    <label for="regPw">PASSWORD</label>
                    <div class="field">
                        <input id="regPw" name="password" type="password" autocomplete="new-password" minlength="8" required>
                        <button class="toggle-pw" type="button" data-for="regPw" aria-pressed="false" aria-label="Show or hide password">SHOW</button>
                    </div>
                    <p class="hint">At least 8 characters.</p>

                    <label for="regConfirm">CONFIRM PASSWORD</label>
                    <input id="regConfirm" name="confirm" type="password" autocomplete="new-password" required>

                    <p id="registerError" class="error" role="alert" aria-live="polite"></p>
                    <button id="registerBtn" class="submit" type="submit">CREATE ACCOUNT</button>
                </form>
                <p class="switch">Already have an account? <button class="link" type="button" data-switch="login">Log in</button></p>
            </div>
        </section>
    </main>

    <footer>DEAD BAI DAYLIGHT</footer>
    <script src="login.js"></script>
    <script src="bgmedia.js"></script>
</body>
</html>
